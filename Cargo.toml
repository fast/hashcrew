[workspace]
members = ["benchmarks", "examples", "rache", "tests-integration"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
readme = "README.md"
rust-version = "1.85"

[workspace.dependencies]
cityhash-rs = "1.0.1"
cityhasher = "0.1.0"
divan = "0.1.21"
fnv = "1.0.7"
murmur3 = "0.5.2"
rache = { path = "rache" }
twox-hash = { version = "2.1.4", default-features = false, features = [
  "std",
  "xxhash3_128",
  "xxhash3_64",
  "xxhash32",
  "xxhash64",
] }
xxhash-rust = { version = "0.8.18", features = ["xxh3", "xxh32", "xxh64"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unknown_lints = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
