name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install nightly lint toolchain
        run: >-
          rustup toolchain install nightly
          --profile minimal
          --component clippy
          --component rustfmt
          --allow-downgrade
          --no-self-update

      - name: Restore Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install repository tools
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: hawkeye@7.0.0,taplo-cli,typos-cli

      - name: Lint workspace
        run: cargo x lint

      - name: Check feature configurations
        run: cargo x check

  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.85.0"]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --no-self-update

      - name: Restore Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run tests
        run: cargo x test

  miri:
    name: Miri
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MIRIFLAGS: -Zmiri-strict-provenance
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Miri
        run: >-
          rustup toolchain install nightly
          --profile minimal
          --component miri
          --no-self-update

      - name: Run release-profile library tests under Miri
        # Release mode disables debug assertions that could otherwise mask an
        # unsafe precondition violation before Miri observes it.
        run: cargo miri test --package hashcrew --lib --no-default-features --release

  target:
    name: Target (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64 AVX2
            target: x86_64-unknown-linux-gnu
            features: --all-features
            rustflags: -C target-feature=+avx2
          - name: AArch64 NEON
            target: aarch64-unknown-linux-gnu
            features: --no-default-features
            rustflags: -C target-feature=+neon
          - name: WebAssembly
            target: wasm32-unknown-unknown
            features: --no-default-features
            rustflags: ""
          - name: bare metal
            target: thumbv7em-none-eabi
            features: --no-default-features
            rustflags: ""
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTFLAGS: -D warnings ${{ matrix.rustflags }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add "${{ matrix.target }}"

      - name: Restore Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Check target
        run: cargo check --package hashcrew --target "${{ matrix.target }}" --locked ${{ matrix.features }}

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Restore Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Validate package contents
        shell: bash
        run: |
          package_files="$(cargo package --package hashcrew --locked --list)"
          for required in Cargo.lock Cargo.toml README.md LICENSE THIRD_PARTY_NOTICES.md src/lib.rs; do
            grep -Fxq "$required" <<< "$package_files" || {
              echo "missing required package file: $required" >&2
              exit 1
            }
          done
          if grep -Eq '^(benchmarks|examples|tests-integration|xtask|target)/' <<< "$package_files"; then
            echo "development-only files leaked into the package" >&2
            exit 1
          fi

      - name: Build package
        run: cargo package --package hashcrew --locked

      - name: Test package
        shell: bash
        run: |
          package_dir="$(find target/package -mindepth 1 -maxdepth 1 -type d -name 'hashcrew-*' -print -quit)"
          test -n "$package_dir"
          cargo test --manifest-path "$package_dir/Cargo.toml" --all-features --locked
          cargo test --manifest-path "$package_dir/Cargo.toml" --no-default-features --locked
