name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install HawkEye
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: hawkeye@7.0.0

      - name: Check license headers
        run: hawkeye check

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Compute compiler cache key
        id: rust
        run: echo "cache-key=$(rustc +stable -vV | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-quality-${{ steps.rust.outputs.cache-key }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-quality-${{ steps.rust.outputs.cache-key }}-

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Lint every target
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        run: cargo +stable test --workspace --all-features --locked

      - name: Test optimized implementations
        run: cargo +stable test -p tests-integration --release --locked

      - name: Test no_std configuration
        run: cargo +stable test -p rache --no-default-features --locked

      - name: Build warning-free documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc -p rache --all-features --no-deps --locked

      - name: Build release benchmarks
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: cargo +stable bench -p benchmarks --no-run --locked

  compatibility:
    name: MSRV and target compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install compatibility toolchains
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable aarch64-unknown-linux-gnu
          rustup target add --toolchain stable wasm32-unknown-unknown
          rustup target add --toolchain stable thumbv7em-none-eabi
          rustup toolchain install 1.85.0 --profile minimal

      - name: Compute compiler cache key
        id: rust
        run: |
          cache_key="$({ rustc +stable -vV; rustc +1.85.0 -vV; } | sha256sum | cut -d ' ' -f 1)"
          echo "cache-key=$cache_key" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-compat-${{ steps.rust.outputs.cache-key }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-compat-${{ steps.rust.outputs.cache-key }}-

      - name: Test minimum supported Rust version
        run: |
          cargo +1.85.0 test --workspace --all-features --locked
          cargo +1.85.0 check -p rache --no-default-features --locked

      - name: Check compile-time AVX2 selection
        env:
          RUSTFLAGS: -D warnings -C target-feature=+avx2
        run: cargo +stable check -p rache --all-features --target x86_64-unknown-linux-gnu --locked

      - name: Check AArch64 NEON no_std build
        env:
          RUSTFLAGS: -D warnings -C target-feature=+neon
        run: cargo +stable check -p rache --no-default-features --target aarch64-unknown-linux-gnu --locked

      - name: Check WebAssembly no_std build
        env:
          RUSTFLAGS: -D warnings
        run: cargo +stable check -p rache --no-default-features --target wasm32-unknown-unknown --locked

      - name: Check bare-metal no_std build
        env:
          RUSTFLAGS: -D warnings
        run: cargo +stable check -p rache --no-default-features --target thumbv7em-none-eabi --locked

  package:
    name: Publishable package
    needs: [quality, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Validate package file set
        shell: bash
        run: |
          package_files="$(cargo +stable package -p rache --locked --list)"
          for required in Cargo.lock Cargo.toml README.md LICENSE NOTICE THIRD_PARTY_NOTICES.md src/lib.rs; do
            grep -Fxq "$required" <<< "$package_files" || {
              echo "missing required package file: $required" >&2
              exit 1
            }
          done
          if grep -Eq '^(benchmarks|examples|tests-integration|target)/' <<< "$package_files"; then
            echo "development-only files leaked into the package" >&2
            exit 1
          fi

      - name: Build package archive
        run: cargo +stable package -p rache --locked

      - name: Test packaged crate
        run: |
          package_dir="$(find target/package -mindepth 1 -maxdepth 1 -type d -name 'rache-*' -print -quit)"
          test -n "$package_dir"
          cargo +stable test --manifest-path "$package_dir/Cargo.toml" --all-features --locked
          cargo +stable test --manifest-path "$package_dir/Cargo.toml" --no-default-features --locked
