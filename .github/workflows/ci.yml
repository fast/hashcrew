name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        run: >-
          rustup toolchain install nightly
          --profile minimal
          --component clippy
          --component rustfmt
          --allow-downgrade
          --no-self-update

      - name: Restore Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install repository tools
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: hawkeye@7.0.0,taplo-cli,typos-cli

      - name: Lint workspace
        run: cargo x lint

      - name: Check feature matrix
        run: cargo x check

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        rust: [stable, "1.85.0"]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --no-self-update

      - name: Restore Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build workspace targets
        run: cargo x build --locked

      - name: Run tests
        run: cargo x test

  miri:
    name: Miri
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MIRIFLAGS: -Zmiri-strict-provenance
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Miri
        run: >-
          rustup toolchain install nightly
          --profile minimal
          --component miri
          --allow-downgrade
          --no-self-update

      - name: Restore Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run Miri tests
        run: cargo x miri

  target:
    name: Target (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64 AVX2
            target: x86_64-unknown-linux-gnu
            rustflags: -C target-feature=+avx2
          - name: AArch64 NEON
            target: aarch64-unknown-linux-gnu
            rustflags: -C target-feature=+neon
          - name: WebAssembly
            target: wasm32-unknown-unknown
            rustflags: ""
          - name: bare metal
            target: thumbv7em-none-eabi
            rustflags: ""
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add "${{ matrix.target }}"

      - name: Restore Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Check target feature matrix
        run: cargo x check --target "${{ matrix.target }}" --no-std --rustflags "${{ matrix.rustflags }}"

  required:
    name: Required
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - check
      - test
      - miri
      - target
    steps:
      - name: Guardian
        run: |
          if [[ ! ( \
                 "${{ needs.check.result }}" == "success" \
              && "${{ needs.test.result }}" == "success" \
              && "${{ needs.miri.result }}" == "success" \
              && "${{ needs.target.result }}" == "success" \
              ) ]]; then
            echo "Required jobs have not completed successfully."
            exit 1
          fi
