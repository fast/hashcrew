name: CRC benchmarks

on:
  pull_request:
    paths:
      - "hashcrew/src/crc/**"
      - "hashcrew/build.rs"
      - "benchmarks/**"
      - "Cargo.lock"
      - ".github/workflows/crc-benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crc-benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: CRC (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal --no-self-update

      - name: Restore Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Record environment
        shell: bash
        run: |
          {
            git rev-parse HEAD
            uname -a
            rustc -Vv
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              lscpu
            else
              sysctl -n machdep.cpu.brand_string
            fi
          } | tee "$RUNNER_TEMP/crc-environment.txt"

      - name: Compare public CRC APIs
        shell: bash
        run: |
          cargo x --help
          cargo x bench --help
          for repeat in 1 2 3; do
            for target in throughput streaming; do
              cargo x bench "$target" --crc-fast -- crc32 --min-time 0.1 --max-time 0.25 --bytes-format binary |
                tee "$RUNNER_TEMP/crc-$target-$repeat.log"
            done
          done

      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crc-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/crc-environment.txt
            ${{ runner.temp }}/crc-*.log
